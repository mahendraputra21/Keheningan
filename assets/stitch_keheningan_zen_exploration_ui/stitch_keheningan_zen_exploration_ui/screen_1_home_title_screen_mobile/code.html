<!DOCTYPE html>
<html class="h-full" lang="id">
	<head>
		<meta charset="utf-8"/>
		<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
		<meta content="mobile_blank" name="shell-type"/>
		<link href="https://fonts.googleapis.com" rel="preconnect"/>
		<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
		<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,300;0,400;0,500;1,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
		<style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>
		<script src="https://cdn.tailwindcss.com"></script>
		<script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"error-container":"#ffdad6","on-secondary-fixed-variant":"#3b4b3d","on-primary":"#ffffff","background":"#fcf9f0","surface":"#fcf9f0","tertiary-fixed-dim":"#dbc2b2","surface-bright":"#fcf9f0","on-tertiary":"#ffffff","on-secondary-container":"#566758","surface-container-low":"#f6f3ea","on-primary-fixed":"#1c1b1a","on-surface-variant":"#494740","surface-dim":"#dddad1","secondary":"#526254","surface-variant":"#e5e2da","on-background":"#1c1c17","primary-container":"#242321","surface-container":"#f1eee5","error":"#ba1a1a","inverse-surface":"#31312b","surface-container-lowest":"#ffffff","on-secondary-fixed":"#101f13","surface-container-highest":"#e5e2da","on-secondary":"#ffffff","tertiary-container":"#2e2016","secondary-fixed":"#d5e7d5","on-primary-fixed-variant":"#484644","primary-fixed-dim":"#cac6c2","on-tertiary-fixed-variant":"#554337","outline-variant":"#cac6bd","surface-tint":"#605e5b","tertiary-fixed":"#f8ddcd","on-error-container":"#93000a","on-surface":"#1c1c17","inverse-primary":"#cac6c2","surface-container-high":"#ebe8df","secondary-fixed-dim":"#b9cbb9","on-tertiary-container":"#9c8678","on-tertiary-fixed":"#26190f","primary":"#0e0d0c","on-primary-container":"#8d8a87","secondary-container":"#d2e4d2","inverse-on-surface":"#f4f1e8","outline":"#7a776f","tertiary":"#160a04","primary-fixed":"#e6e2de","on-error":"#ffffff"},"borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},"spacing":{"margin":"4rem","margin-mobile":"1.5rem","gutter":"2rem","space-xs":"0.375rem","gutter-mobile":"1rem","space-md":"1.5rem","space-lg":"2.5rem","space-xl":"4.5rem","space-sm":"0.75rem"},"fontFamily":{"body-lg":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"headline-lg":["Noto Serif"],"headline-md":["Noto Serif"],"headline-xl":["Noto Serif"],"headline-xl-mobile":["Noto Serif"],"body-sm":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-sm":["Noto Serif"],"headline-lg-mobile":["Noto Serif"]},"fontSize":{"body-lg":["1.125rem",{"lineHeight":"1.8","letterSpacing":"0.025em","fontWeight":"300"}],"label-sm":["0.6875rem",{"lineHeight":"1.4","letterSpacing":"0.16em","fontWeight":"500"}],"label-md":["0.8125rem",{"lineHeight":"1.4","letterSpacing":"0.12em","fontWeight":"500"}],"headline-lg":["2.5rem",{"lineHeight":"1.3","letterSpacing":"0.03em","fontWeight":"400"}],"headline-md":["1.75rem",{"lineHeight":"1.4","letterSpacing":"0.02em","fontWeight":"400"}],"headline-xl":["3.5rem",{"lineHeight":"1.2","letterSpacing":"0.04em","fontWeight":"400"}],"headline-xl-mobile":["2.25rem",{"lineHeight":"1.25","letterSpacing":"0.03em","fontWeight":"400"}],"body-sm":["0.8125rem",{"lineHeight":"1.65","letterSpacing":"0.03em","fontWeight":"400"}],"body-md":["0.9375rem",{"lineHeight":"1.75","letterSpacing":"0.02em","fontWeight":"300"}],"headline-sm":["1.25rem",{"lineHeight":"1.45","letterSpacing":"0.02em","fontWeight":"500"}],"headline-lg-mobile":["1.75rem",{"lineHeight":"1.3","letterSpacing":"0.02em","fontWeight":"400"}]}}}};</script>
	</head>
	<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen selection:bg-surface-variant selection:text-primary">
		<main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface">
			<div class="flex flex-col w-full relative overflow-hidden select-none">
				<!-- Atmospheric Background Canvas with Watercolor Visual and Washi Paper Overlay -->
				<div class="absolute inset-0 pointer-events-none -z-10 overflow-hidden">
					<div class="w-full h-full bg-cover bg-center opacity-85 transition-opacity duration-1000 scale-[1.03]" data-alt="Soft atmospheric Japanese sumi-e watercolor landscape of a tranquil rural mountain village at dawn. Traditional thatched minka houses nestled alongside a crystalline meandering stream with stepping stones, gentle morning mist swirling through pine trees and willow branches, painted on tactile fibrous warm washi paper with muted earth tones, sage moss green, and charcoal ink washes." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBosT2GLhWtmskXUak0YaBmpP5Ys74Fmsy_bdbbQW8bMvvarDIZoBEgca9GR_BwY0cdQJMXiTIpS4c7Z2j9YmAqbmeH-Zqqa2WkEVW1nZtZWJjVVaQU4g0S4aJ_5y_fzO2g1rYSCaME9a3whdoug0VXGh-EjjgZLjxEY3sfOqowh5BfJJeBlRfv0MPRJJ_OGKcRSzaFu1Z-jjwf6AnL0EGH3A-nQaGEPkbODXjT6rcdgRbIjiJyvlVjZg')"></div>
					<!-- Mist Diffusion Gradient & Washi Texture Scrims -->
					<div class="absolute inset-0 bg-gradient-to-b from-surface/80 via-surface/40 to-surface/95"></div>
					<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/60 to-transparent"></div>
					<div class="absolute inset-0 bg-surface/20 backdrop-blur-[0.5px]"></div>
				</div>
				<!-- Screen Content Wrapper -->
				<div class="flex flex-col justify-between w-full px-margin-mobile py-space-md min-h-[780px] max-w-md mx-auto relative z-10">
					<!-- Top Perimeter Navigation: Language Toggle & Sound Ritual -->
					<header class="flex items-center justify-between w-full pt-1">
						<!-- Minimalist Bilingual Toggle (ID | EN) -->
						<button aria-label="Ganti Bahasa / Switch Language" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container/70 backdrop-blur-md shadow-sm transition-all duration-300 active:scale-95 text-on-surface" id="lang-toggle-btn" type="button">
							<span class="font-label-sm text-label-sm font-semibold tracking-widest text-primary transition-colors" id="btn-lang-id">ID</span>
							<span class="text-outline-variant font-light text-label-sm">/</span>
							<span class="font-label-sm text-label-sm font-light tracking-widest text-on-surface-variant transition-colors" id="btn-lang-en">EN</span>
						</button>
						<!-- Hanko Seal & Ambient Audio Vessel -->
						<div class="flex items-center gap-2">
							<span class="px-2 py-1 rounded bg-tertiary-container/10 font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase">
          無為
        </span>
							<button aria-label="Heningkan Audio / Mute Atmosphere" class="w-9 h-9 rounded-full bg-surface-container/70 backdrop-blur-md flex items-center justify-center text-on-surface shadow-sm transition-all duration-300 active:scale-90" id="sound-toggle-btn" type="button">
								<span class="material-symbols-outlined text-[18px] transition-transform duration-500" id="sound-icon">volume_down</span>
							</button>
						</div>
					</header>
					<!-- Centerpiece: Ensō Calligraphy, Title & Poetic Whispers -->
					<div class="flex flex-col items-center justify-center text-center my-auto py-space-md">
						<!-- Breathing Ensō Halo -->
						<div class="relative w-36 h-36 flex items-center justify-center mb-space-sm group">
							<div class="absolute inset-0 rounded-full bg-secondary-container/20 blur-xl animate-pulse"></div>
							<img alt="Ensō Zen Circle Brush Stroke" 
              class="relative w-32 h-32 object-contain drop-shadow-sm transition-transform duration-[4000ms] ease-in-out transform hover:scale-105" 
              src="./assets/enzo.png"/>
						</div>
						<!-- App Title -->
						<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-[0.28em] text-primary uppercase pl-2 mb-1.5">
        Keheningan
      </h1>
						<!-- Bilingual Subtitle -->
						<p class="font-body-md text-body-md text-on-surface-variant italic max-w-xs transition-opacity duration-300" data-i18n-key="subtitle">
        sebuah perjalanan kecil dalam diam
      </p>
						<!-- Hanko Mark Indicator -->
						<div class="mt-4 flex items-center justify-center gap-2">
							<span class="h-[1px] w-6 bg-outline-variant/40"></span>
							<span class="font-label-sm text-label-sm text-outline tracking-[0.2em] uppercase" data-i18n-key="chapter_cue">
          Bab I • Tepi Sungai
        </span>
							<span class="h-[1px] w-6 bg-outline-variant/40"></span>
						</div>
					</div>
					<!-- Actions & Saved Progress Philosophy -->
					<div class="flex flex-col w-full gap-space-sm mb-2">
						<!-- Saved Progress Card: Continue Flow -->
						<div class="flex flex-col w-full gap-2">
							<button class="group w-full py-3.5 px-space-md rounded-lg bg-primary-container text-on-primary shadow-md transition-all duration-400 ease-out active:translate-y-[1px] hover:opacity-90 flex items-center justify-between" id="btn-continue" type="button">
								<div class="flex flex-col text-left">
									<span class="font-label-md text-label-md tracking-[0.16em] uppercase text-surface" data-i18n-key="btn_continue">
              LANJUTKAN
            </span>
									<span class="font-body-sm text-body-sm text-on-primary-container font-light line-clamp-1" data-i18n-key="saved_state">
              Tepi Aliran Seserahan • 24m lalu
            </span>
								</div>
								<span class="material-symbols-outlined text-surface transition-transform duration-300 group-hover:translate-x-1">
            arrow_forward
          </span>
							</button>
							<!-- Secondary Action: Start Blank Journey -->
							<button class="w-full py-3 px-space-md rounded-lg bg-surface-container-high/80 backdrop-blur-sm text-on-surface shadow-sm transition-all duration-300 active:scale-[0.99] hover:bg-surface-container flex items-center justify-center" id="btn-start" type="button">
								<span class="font-label-md text-label-md tracking-[0.18em] uppercase text-on-surface" data-i18n-key="btn_start">
            MULAI
          </span>
							</button>
						</div>
						<!-- Reset & Subtle Options Trigger -->
						<div class="flex flex-col items-center justify-center pt-1 text-center">
							<button class="font-label-sm text-label-sm tracking-widest text-on-surface-variant/80 hover:text-primary transition-colors py-1 inline-flex items-center gap-1 group" id="btn-restart" type="button">
								<span data-i18n-key="btn_reset">MULAI DARI AWAL</span>
								<span class="material-symbols-outlined text-[14px] text-outline group-hover:text-primary transition-colors">refresh</span>
							</button>
							<span class="font-body-sm text-body-sm text-outline/80 scale-95 transition-opacity duration-300" data-i18n-key="reset_hint" id="reset-hint">
          Mulai dari awal &amp; reset kemajuan lokal
        </span>
						</div>
					</div>
					<!-- Atmospheric Zen Footnote & Device Local Indicator -->
					<footer class="flex flex-col items-center text-center gap-1.5 pt-2">
						<!-- Device Local Status -->
						<div class="inline-flex items-center gap-1.5 text-on-surface-variant/75">
							<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
							<span class="font-label-sm text-label-sm tracking-wider" data-i18n-key="offline_badge">
          Tersimpan lokal di perangkat • Mainkan kapan saja tanpa internet
        </span>
						</div>
						<!-- Ensō Philosophy Quote -->
						<p class="font-body-sm text-body-sm text-outline italic" data-i18n-key="philosophy">
        円相 • Tidak ada yang perlu dicapai di sini
      </p>
					</footer>
				</div>
			</div>
			<script>
  (function() {
    const translations = {
      id: {
        subtitle: "sebuah perjalanan kecil dalam diam",
        chapter_cue: "Bab I • Tepi Sungai",
        btn_continue: "LANJUTKAN",
        saved_state: "Tepi Aliran Seserahan • 24m lalu",
        btn_start: "MULAI",
        btn_reset: "MULAI DARI AWAL",
        reset_hint: "Mulai dari awal & reset kemajuan lokal",
        offline_badge: "Tersimpan lokal di perangkat • Mainkan kapan saja tanpa internet",
        philosophy: "円相 • Tidak ada yang perlu dicapai di sini"
      },
      en: {
        subtitle: "a quiet little journey in silence",
        chapter_cue: "Chapter I • Riverbank",
        btn_continue: "CONTINUE",
        saved_state: "Whispering Stream • 24m ago",
        btn_start: "START",
        btn_reset: "NEW JOURNEY",
        reset_hint: "Begin anew & reset local discovery",
        offline_badge: "Saved locally on device • Play offline anytime",
        philosophy: "円相 • Nothing to achieve here"
      }
    };

    let currentLang = "id";
    let isSoundOn = true;

    const langToggleBtn = document.getElementById("lang-toggle-btn");
    const langIdLabel = document.getElementById("btn-lang-id");
    const langEnLabel = document.getElementById("btn-lang-en");
    const soundToggleBtn = document.getElementById("sound-toggle-btn");
    const soundIcon = document.getElementById("sound-icon");
    const restartBtn = document.getElementById("btn-restart");
    const resetHint = document.getElementById("reset-hint");

    function applyLanguage(lang) {
      currentLang = lang;
      const dict = translations[lang];

      document.querySelectorAll("[data-i18n-key]").forEach(elem => {
        const key = elem.getAttribute("data-i18n-key");
        if (dict[key]) {
          elem.innerHTML = dict[key];
        }
      });

      if (lang === "id") {
        langIdLabel.classList.add("font-semibold", "text-primary");
        langIdLabel.classList.remove("font-light", "text-on-surface-variant");
        langEnLabel.classList.add("font-light", "text-on-surface-variant");
        langEnLabel.classList.remove("font-semibold", "text-primary");
      } else {
        langEnLabel.classList.add("font-semibold", "text-primary");
        langEnLabel.classList.remove("font-light", "text-on-surface-variant");
        langIdLabel.classList.add("font-light", "text-on-surface-variant");
        langIdLabel.classList.remove("font-semibold", "text-primary");
      }
    }

    if (langToggleBtn) {
      langToggleBtn.addEventListener("click", () => {
        const next = currentLang === "id" ? "en" : "id";
        applyLanguage(next);
      });
    }

    if (soundToggleBtn && soundIcon) {
      soundToggleBtn.addEventListener("click", () => {
        isSoundOn = !isSoundOn;
        soundIcon.textContent = isSoundOn ? "volume_down" : "volume_off";
        soundToggleBtn.classList.toggle("opacity-60", !isSoundOn);
      });
    }

    if (restartBtn && resetHint) {
      restartBtn.addEventListener("click", () => {
        const originalText = resetHint.innerHTML;
        resetHint.innerHTML = currentLang === "id" ? "Kemajuan telah diatur ulang ke awal" : "Progress quietly reset";
        resetHint.classList.add("text-secondary", "font-medium");
        setTimeout(() => {
          resetHint.innerHTML = originalText;
          resetHint.classList.remove("text-secondary", "font-medium");
        }, 2600);
      });
    }
  })();
</script>
		</main>
	</body>
</html>
